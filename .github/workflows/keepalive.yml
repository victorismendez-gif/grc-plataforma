name: Mantener activo Supabase

# El plan gratuito pausa el proyecto tras 7 días sin actividad.
# Esta tarea hace una consulta mínima cada día.
on:
  schedule:
    - cron: "17 11 * * *" # 6:17 a. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # URL y llave publicable: son públicas por diseño (la seguridad la da RLS).
      SUPABASE_URL: https://dvggwzoyiqvlyzexjnqn.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QEb4CBS6VuvwxLgPj_lZVQ_ACEq5PL5
    steps:
      - name: Consultar la base
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
            cat /tmp/r.txt; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error title=Keepalive::La base respondió $code"
          exit 1
