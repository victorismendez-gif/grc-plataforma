[build]
  command = "npm run build"
  publish = ".next"
  # El plan gratuito tiene 300 créditos al mes y cada publicación en producción
  # cuesta 15 (unas 20 al mes). Solo se publica cuando el último commit lleva
  # «[deploy]» en el mensaje; el resto se omite sin gastar créditos.
  # (exit 0 = omitir; exit 1 = construir y publicar)
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # Las variables NEXT_PUBLIC_* son públicas por diseño: van dentro del código
  # que descarga el navegador (la seguridad la da RLS en la base). Se excluyen
  # del escaneo de secretos; SUPABASE_SERVICE_ROLE_KEY sí se sigue vigilando.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL"
