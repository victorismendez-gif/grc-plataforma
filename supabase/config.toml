# Configuración de Supabase local (desarrollo y GitHub Actions).
# En producción estos ajustes de Auth se replican en el panel de Supabase
# (ver docs/configuracion-produccion.md).
project_id = "grc-plataforma"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Solo el administrador crea cuentas (por invitación)
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.invite]
subject = "Invitación a la Plataforma GRC"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Recupera tu contraseña de la Plataforma GRC"
content_path = "./supabase/templates/recovery.html"
